<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Foodo - Login</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="login-container">

        <!-- LEFT SIDE -->

        <div class="login-left">

            <div class="brand">
                🍴 Foodo.
            </div>

            <div class="welcome">

                <h1>Welcome Back! 👋</h1>

                <p>
                    Login to order your favorite food
                    and enjoy fast delivery.
                </p>

                <div class="features">

                    <div>
                        🚴
                        <span>Fast Delivery</span>
                    </div>

                    <div>
                        🍕
                        <span>Delicious Food</span>
                    </div>

                    <div>
                        🔒
                        <span>Secure & Safe</span>
                    </div>

                </div>

            </div>

        </div>


        <!-- RIGHT SIDE -->

        <div class="login-right">

            <div class="login-box">

                <h2>Login</h2>

                <p class="subtitle">
                    Enter your details to continue
                </p>


                <form id="loginForm">

                    <!-- EMAIL -->

                    <label>Email Address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >


                    <!-- PASSWORD -->

                    <label>Password</label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="passwordInput"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            type="button"
                            id="showPassword">
                            👁
                        </bu
                        
                        ton>

                    </div>


                    <div class="options">

                        <label class="remember">
                            <input type="checkbox">
                            Remember me
                        </label>

                        <a href="#">
                            Forgot Password?
                        </a>

                    </div>


                    <button
                        type="submit"
                        class="login-submit">
                        Login
                    </button>

                </form>


                <div class="divider">
                    <span>or continue with</span>
                </div>


                <div class="social-login">

                    <button>
                        Google
                    </button>

                    <button>
                        Facebook
                    </button>

                </div>


                <p class="register-text">

                    Don't have an account?

                    <a href="register.html">
                        Create Account
                    </a>

                </p>


                <a href="index.html" class="home-link">
                    ← Back to Home
                </a>

            </div>

        </div>

    </div>


    <script src="login.js"></script>

</body>

</html>
