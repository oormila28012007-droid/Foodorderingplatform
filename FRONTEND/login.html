<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foodie - Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: linear-gradient(135deg, #fff0e6, #ffe0cc);
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 30px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 8px 30px #0002;
    }

    h2 {
      text-align: center;
      color: #ff5722;
      margin-bottom: 8px;
    }

    h3 {
      color: #ff5722;
      margin: 15px 0;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin: 12px 0 22px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      font-weight: bold;
      color: #444;
    }

    input, select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 15px;
      border: 0;
      border-radius: 8px;
      background: #ff5722;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #e64a19;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .link {
      text-align: right;
      margin-top: 10px;
    }

    .link a, .register-link a {
      color: #ff5722;
      text-decoration: none;
    }

    .message {
      margin-top: 12px;
      text-align: center;
      font-size: 14px;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    .hidden {
      display: none !important;
    }

    .back {
      background: #526ca8;
    }

    .register-link {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <main class="card">
    <h2>🍴 Foodie Login</h2>
    <p class="subtitle">Welcome back!</p>

    <!-- LOGIN -->
    <section id="loginSection">
      <form id="loginForm">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          required
          autocomplete="email"
          placeholder="Enter your registered email"
        >

        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          required
          autocomplete="current-password"
          placeholder="Enter password"
        >

        <div class="link">
          <a href="#" id="forgotLink">Forgot Password?</a>
        </div>

        <label for="role">Login As</label>
        <select id="role">
          <option value="user">User</option>
          <option value="admin">Admin</option>
        </select>

        <button type="button" id="sendLoginOtp">
          Send Login OTP
        </button>

        <div id="loginOtpArea" class="hidden">
          <label for="loginOtp">Enter Login OTP</label>
          <input
            type="text"
            id="loginOtp"
            inputmode="numeric"
            maxlength="6"
            placeholder="Enter 6-digit OTP"
          >

          <button type="button" id="verifyLoginOtp">
            Verify OTP
          </button>
        </div>

        <button type="submit">Login</button>
        <p id="loginMessage" class="message" role="status"></p>
      </form>

      <p class="register-link">
        Don't have an account?
        <a href="register.html">Register here</a>
      </p>
    </section>

    <!-- FORGOT PASSWORD - SAME PAGE -->
    <section id="forgotSection" class="hidden">
      <h3>Reset Password</h3>

      <p class="subtitle">
        Get an OTP at your registered email and set a new password here.
      </p>

      <label for="resetEmail">Registered Email</label>
      <input
        type="email"
        id="resetEmail"
        autocomplete="email"
        placeholder="Enter your registered email"
      >

      <button type="button" id="sendResetOtp">
        Send Reset OTP
      </button>

      <div id="resetOtpArea" class="hidden">
        <label for="resetOtp">Enter Reset OTP</label>
        <input
          type="text"
          id="resetOtp"
          inputmode="numeric"
          maxlength="6"
          placeholder="Enter 6-digit OTP"
        >

        <label for="newPassword">New Password</label>
        <input
          type="password"
          id="newPassword"
          autocomplete="new-password"
          placeholder="At least 8 characters"
        >

        <label for="confirmPassword">Confirm New Password</label>
        <input
          type="password"
          id="confirmPassword"
          autocomplete="new-password"
          placeholder="Re-enter new password"
        >

        <button type="button" id="resetPasswordBtn">
          Change Password
        </button>
      </div>

      <p id="resetMessage" class="message" role="status"></p>

      <button type="button" class="back" id="backToLogin">
        Back to Login
      </button>
    </section>
  </main>

  <script>
    const API = "http://localhost:5000/api";

    const $ = id => document.getElementById(id);

    let loginOtpVerified = false;
    let verifiedLoginEmail = "";

    async function apiRequest(endpoint, body) {
      const response = await fetch(`${API}${endpoint}`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(body)
      });

      const data = await response.json().catch(() => ({}));

      if (!response.ok) {
        throw new Error(data.message || "Request failed.");
      }

      return data;
    }

    function showMessage(id, message) {
      $(id).textContent = message;
    }

    function setBusy(buttonId, busy, busyText) {
      const button = $(buttonId);

      if (busy) {
        button.dataset.originalText = button.textContent;
        button.textContent = busyText;
        button.disabled = true;
      } else {
        button.textContent =
          button.dataset.originalText || button.textContent;
        button.disabled = false;
      }
    }

    // Open Forgot Password on the same page
    $("forgotLink").addEventListener("click", event => {
      event.preventDefault();

      $("loginSection").classList.add("hidden");
      $("forgotSection").classList.remove("hidden");

      $("resetEmail").value = $("email").value.trim();
      showMessage("resetMessage", "");
    });

    // Return to Login on the same page
    $("backToLogin").addEventListener("click", () => {
      $("forgotSection").classList.add("hidden");
      $("loginSection").classList.remove("hidden");
      showMessage("loginMessage", "");
    });

    // Send Login OTP
    $("sendLoginOtp").addEventListener("click", async () => {
      const email = $("email").value.trim().toLowerCase();

      if (!email) {
        showMessage("loginMessage", "Enter your email first.");
        $("email").focus();
        return;
      }

      setBusy("sendLoginOtp", true, "Sending OTP...");
      showMessage("loginMessage", "");

      try {
        const data = await apiRequest("/send-otp", { email });

        showMessage("loginMessage", data.message || "OTP sent successfully.");
        $("loginOtpArea").classList.remove("hidden");

        loginOtpVerified = false;
        verifiedLoginEmail = "";
        $("loginOtp").value = "";
      } catch (error) {
        showMessage("loginMessage", error.message);
      } finally {
        setBusy("sendLoginOtp", false);
      }
    });

    // Verify Login OTP
    $("verifyLoginOtp").addEventListener("click", async () => {
      const email = $("email").value.trim().toLowerCase();
      const otp = $("loginOtp").value.trim();

      if (!/^\d{6}$/.test(otp)) {
        showMessage("loginMessage", "Enter the 6-digit OTP.");
        return;
      }

      setBusy("verifyLoginOtp", true, "Verifying...");

      try {
        const data = await apiRequest("/verify-otp", { email, otp });

        loginOtpVerified = true;
        verifiedLoginEmail = email;

        showMessage(
          "loginMessage",
          data.message || "OTP verified successfully."
        );
      } catch (error) {
        loginOtpVerified = false;
        verifiedLoginEmail = "";
        showMessage("loginMessage", error.message);
      } finally {
        setBusy("verifyLoginOtp", false);
      }
    });

    // Login
    $("loginForm").addEventListener("submit", async event => {
      event.preventDefault();

      const email = $("email").value.trim().toLowerCase();
      const password = $("password").value;
      const role = $("role").value;

      if (!loginOtpVerified || verifiedLoginEmail !== email) {
        showMessage("loginMessage", "Please verify a new login OTP first.");
        return;
      }

      if (role === "admin") {
        showMessage(
          "loginMessage",
          "Admin login is not configured by this user-login API. Please configure secure admin authentication on the backend."
        );
        return;
      }

      const button = $("loginForm").querySelector(
        'button[type="submit"]'
      );
      button.disabled = true;
      button.textContent = "Logging in...";

      try {
        const data = await apiRequest("/login", { email, password });

        if (!data.user) {
          throw new Error("User details were not returned by the server.");
        }

        localStorage.setItem("loggedInUser", JSON.stringify(data.user));

        window.location.href = "user-dashboard.html";
      } catch (error) {
        showMessage("loginMessage", error.message);
      } finally {
        button.disabled = false;
        button.textContent = "Login";
      }
    });

    // Send Password Reset OTP
    $("sendResetOtp").addEventListener("click", async () => {
      const email = $("resetEmail").value.trim().toLowerCase();

      if (!email) {
        showMessage("resetMessage", "Enter your registered email.");
        $("resetEmail").focus();
        return;
      }

      setBusy("sendResetOtp", true, "Sending OTP...");
      showMessage("resetMessage", "");

      try {
        const data = await apiRequest("/forgot-password/send-otp", {
          email
        });

        $("resetOtpArea").classList.remove("hidden");
        $("resetOtp").value = "";
        $("newPassword").value = "";
        $("confirmPassword").value = "";

        showMessage(
          "resetMessage",
          data.message || "Reset OTP sent. Check your email."
        );
      } catch (error) {
        showMessage("resetMessage", error.message);
      } finally {
        setBusy("sendResetOtp", false);
      }
    });

    // Change Password: backend verifies the reset OTP here
    $("resetPasswordBtn").addEventListener("click", async () => {
      const email = $("resetEmail").value.trim().toLowerCase();
      const otp = $("resetOtp").value.trim();
      const newPassword = $("newPassword").value;
      const confirmPassword = $("confirmPassword").value;

      if (!email || !/^\d{6}$/.test(otp) ||
          !newPassword || !confirmPassword) {
        showMessage(
          "resetMessage",
          "Enter your email, 6-digit OTP and both password fields."
        );
        return;
      }

      if (newPassword !== confirmPassword) {
        showMessage("resetMessage", "Passwords do not match.");
        return;
      }

      if (
        newPassword.length < 8 ||
        !/[A-Z]/.test(newPassword) ||
        !/[0-9]/.test(newPassword) ||
        !/[^A-Za-z0-9]/.test(newPassword)
      ) {
        showMessage(
          "resetMessage",
          "Use at least 8 characters with an uppercase letter, a number and a special character."
        );
        return;
      }

      setBusy("resetPasswordBtn", true, "Changing Password...");
      showMessage("resetMessage", "");

      try {
        const data = await apiRequest("/forgot-password/reset", {
          email,
          otp,
          newPassword
        });

        showMessage(
          "resetMessage",
          data.message || "Password changed successfully. You can log in now."
        );

        $("resetOtpArea").classList.add("hidden");
        $("resetEmail").value = email;

        $("loginSection").classList.remove("hidden");
        $("forgotSection").classList.add("hidden");

        $("email").value = email;
        $("password").value = "";
        $("loginOtp").value = "";
        $("loginOtpArea").classList.add("hidden");

        loginOtpVerified = false;
        verifiedLoginEmail = "";

        showMessage(
          "loginMessage",
          "Password changed successfully. Send a new login OTP and log in."
        );
      } catch (error) {
        showMessage("resetMessage", error.message);
      } finally {
        setBusy("resetPasswordBtn", false);
      }
    });
  </script>
</body>
</html>
