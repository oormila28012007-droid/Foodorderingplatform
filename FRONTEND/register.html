<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Foodo - Create Account</title>

    <link rel="stylesheet" href="register.css">
</head>

<body>

    <div class="register-container">

        <!-- LEFT SIDE -->

        <div class="register-left">

            <div class="brand">
                🍴 Foodo.
            </div>

            <div class="welcome">

                <h1>Join Foodo! 🍕</h1>

                <p>
                    Create your account and discover
                    delicious food from your favorite restaurants.
                </p>

                <div class="features">

                    <div>
                        🚴
                        <span>Fast Delivery</span>
                    </div>

                    <div>
                        🍔
                        <span>Thousands of Foods</span>
                    </div>

                    <div>
                        🎁
                        <span>Exclusive Offers</span>
                    </div>

                    <div>
                        🔒
                        <span>Safe & Secure</span>
                    </div>

                </div>

            </div>

        </div>


        <!-- RIGHT SIDE -->

        <div class="register-right">

            <div class="register-box">

                <h2>Create Account</h2>

                <p class="subtitle">
                    Sign up to start ordering your favorite food
                </p>


                <form id="registerForm">

                    <!-- FULL NAME -->

                    <label>Full Name</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >


                    <!-- EMAIL -->

                    <label>Email Address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >


                    <!-- PHONE -->

                    <label>Phone Number</label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter your phone number"
                        maxlength="10"
                        required
                    >


                    <!-- PASSWORD -->

                    <label>Password</label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            placeholder="Create a password"
                            required
                        >

                        <button
                            type="button"
                            id="showPassword">
                            👁
                        </button>

                    </div>


                    <!-- CONFIRM PASSWORD -->

                    <label>Confirm Password</label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm your password"
                            required
                        >

                        <button
                            type="button"
                            id="showConfirmPassword">
                            👁
                        </button>

                    </div>


                    <!-- TERMS -->

                    <label class="terms">

                        <input
                            type="checkbox"
                            id="terms"
                            required
                        >

                        <span>
                            I agree to the
                            <a href="#">Terms & Conditions</a>
                        </span>

                    </label>


                    <!-- REGISTER BUTTON -->

                    <button
                        type="submit"
                        class="register-submit">

                        Create Account

                    </button>

                </form>


                <!-- LOGIN -->

                <p class="login-text">

                    Already have an account?

                    <a href="login.html">
                        Login
                    </a>

                </p>


                <!-- HOME -->

                <a
                    href="index.html"
                    class="home-link">

                    ← Back to Home

                </a>

            </div>

        </div>

    </div>


    <script src="register.js"></script>

</body>

</html>
