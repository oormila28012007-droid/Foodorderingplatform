<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Foodie | My Orders</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #fff8f2;
    color: #35231c;
}

.navbar {
    background: #241712;
    color: white;
    padding: 20px 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 25px;
    font-weight: bold;
}

.logo span {
    color: #ff7a00;
}

.home-btn {
    background: #ff7a00;
    color: white;
    padding: 10px 18px;
    border: none;
    border-radius: 20px;
    cursor: pointer;
}

.container {
    width: 90%;
    max-width: 1000px;
    margin: 35px auto;
}

h1 {
    color: #e9571b;
    margin-bottom: 10px;
}

.subtitle {
    color: #8a7165;
    margin-bottom: 25px;
}

.orders-container {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.order-card {
    background: white;
    padding: 25px;
    border-radius: 18px;
    border-left: 6px solid #ff701c;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

.order-header {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 18px;
}

.order-header h2 {
    color: #e9571b;
    font-size: 20px;
}

.status {
    background: #fff0e2;
    color: #e96516;
    padding: 8px 14px;
    border-radius: 20px;
    font-weight: bold;
    font-size: 13px;
}

.details {
    background: #fffaf7;
    padding: 15px;
    border-radius: 12px;
    line-height: 1.8;
    overflow-wrap: anywhere;
}

.items {
    margin-top: 15px;
    background: #fff7f0;
    padding: 15px;
    border-radius: 12px;
}

.items h3 {
    color: #df531b;
    margin-bottom: 10px;
}

.item {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid #f0d9ca;
    gap: 10px;
}

.total {
    text-align: right;
    color: #e65316;
    font-size: 20px;
    font-weight: bold;
    margin-top: 18px;
}

.empty {
    text-align: center;
    background: white;
    padding: 45px 20px;
    border-radius: 18px;
    color: #8a7165;
}

.empty h2 {
    color: #e9571b;
    margin-bottom: 10px;
}

.loading {
    text-align: center;
    padding: 30px;
}

@media (max-width: 600px) {
    .container {
        width: 94%;
    }

    .order-card {
        padding: 18px;
    }
}
</style>
</head>

<body>

<nav class="navbar">
    <div class="logo">🍴 <span>Foodie</span></div>

    <button class="home-btn" onclick="goHome()">
        Home
    </button>
</nav>

<main class="container">

    <h1>📦 My Orders</h1>
    <p class="subtitle">View your food orders and delivery status.</p>

    <div id="ordersContainer" class="orders-container">
        <div class="loading">Loading your orders...</div>
    </div>

</main>

<script>

const ORDER_API = "http://localhost:5000/api/orders";

function goHome() {
    window.location.href = "index.html";
}

/* GET LOGGED-IN USER EMAIL */

function getUserEmail() {

    const possibleKeys = [
        "user",
        "loggedInUser",
        "currentUser",
        "loginUser"
    ];

    for (let key of possibleKeys) {

        const savedData = localStorage.getItem(key);

        if (!savedData) {
            continue;
        }

        try {

            const user = JSON.parse(savedData);

            if (user.email) {
                return user.email;
            }

        } catch (error) {

            if (savedData.includes("@")) {
                return savedData;
            }

        }

    }

    return localStorage.getItem("userEmail");

}

/* LOAD MY ORDERS */

async function loadMyOrders() {

    const container =
        document.getElementById("ordersContainer");

    try {

        const response = await fetch(ORDER_API);

        if (!response.ok) {
            throw new Error("Unable to fetch orders");
        }

        const orders = await response.json();

        const userEmail = getUserEmail();

        let myOrders = orders;

        /*
        If email is available, show only
        the logged-in user's orders.
        */

        if (userEmail) {

            myOrders = orders.filter(order =>
                order.email &&
                order.email.toLowerCase() ===
                userEmail.toLowerCase()
            );

        }

        displayOrders(myOrders);

    } catch (error) {

        console.error(error);

        container.innerHTML = `
            <div class="empty">
                <h2>Unable to Load Orders</h2>
                <p>Please check whether the backend is running.</p>
            </div>
        `;

    }

}

/* DISPLAY ORDERS */

function displayOrders(orders) {

    const container =
        document.getElementById("ordersContainer");

    if (orders.length === 0) {

        container.innerHTML = `
            <div class="empty">
                <h2>📦 No Orders Found</h2>
                <p>You have not placed any orders yet.</p>
            </div>
        `;

        return;

    }

    container.innerHTML = orders.map((order, index) => {

        const status = order.status || "Pending";

        const orderDate = order.createdAt
            ? new Date(order.createdAt).toLocaleString()
            : "Not available";

        const items = Array.isArray(order.items)
            ? order.items
            : [];

        const itemsHTML = items.map(item => {

            const quantity = Number(item.quantity || 1);
            const price = Number(item.price || 0);

            return `
                <div class="item">
                    <span>
                        ${item.name || "Food Item"} × ${quantity}
                    </span>

                    <strong>
                        ₹${price * quantity}
                    </strong>
                </div>
            `;

        }).join("");

        return `
            <div class="order-card">

                <div class="order-header">

                    <h2>🧾 Order ${index + 1}</h2>

                    <span class="status">
                        ${status}
                    </span>

                </div>

                <div class="details">

                    <p>
                        <strong>Order ID:</strong>
                        ${order._id || "Not available"}
                    </p>

                    <p>
                        <strong>Name:</strong>
                        ${order.customerName || "Not available"}
                    </p>

                    <p>
                        <strong>Email:</strong>
                        ${order.email || "Not available"}
                    </p>

                    <p>
                        <strong>Phone:</strong>
                        ${order.phone || "Not available"}
                    </p>

                    <p>
                        <strong>Address:</strong>
                        ${order.address || "Not available"}
                    </p>

                    <p>
                        <strong>Date:</strong>
                        ${orderDate}
                    </p>

                </div>

                <div class="items">

                    <h3>🍔 Ordered Items</h3>

                    ${itemsHTML || "<p>No item details available</p>"}

                </div>

                <div class="total">
                    Total: ₹${Number(order.totalAmount || 0)}
                </div>

            </div>
        `;

    }).join("");

}

loadMyOrders();

</script>

</body>
</html>
