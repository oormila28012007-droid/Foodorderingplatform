<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Foodie | Admin Dashboard</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", Arial, sans-serif;
}

body {
    background: #fff8f2;
    color: #35231c;
}

.navbar {
    background: #241712;
    color: white;
    padding: 20px 6%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
}

.logo {
    font-size: 28px;
    font-weight: bold;
}

.logo span {
    color: #ff7a00;
}

.admin-badge {
    border: 1px solid #ff7a00;
    color: #ffad68;
    padding: 9px 17px;
    border-radius: 30px;
    font-size: 13px;
}

.main-container {
    width: 90%;
    max-width: 1250px;
    margin: 35px auto;
}

.welcome {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 30px;
}

.welcome h1 {
    font-size: 32px;
    margin-bottom: 8px;
}

.welcome p {
    color: #8a7165;
}

.welcome-icon {
    font-size: 60px;
}

.summary-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
    margin-bottom: 35px;
}

.summary-card {
    background: white;
    padding: 23px;
    border-radius: 20px;
    box-shadow: 0 8px 25px rgba(91, 48, 20, 0.07);
    border: 1px solid #ffeadb;
}

.card-icon {
    font-size: 27px;
    margin-bottom: 15px;
}

.summary-card h3 {
    color: #92776a;
    font-size: 13px;
    margin-bottom: 10px;
}

.summary-card h2 {
    color: #ef5b1c;
    font-size: 31px;
}

.section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
    margin: 30px 0 20px;
}

.section-header h2 {
    font-size: 25px;
}

.section-header h2 span {
    color: #ff6b1a;
}

.filter-box {
    background: white;
    border: 2px solid #ffd1b0;
    padding: 12px 16px;
    border-radius: 12px;
}

.orders-panel {
    background: #fff0e5;
    border: 1px solid #ffd4b8;
    border-radius: 24px;
    padding: 20px;
    max-height: 700px;
    overflow-y: auto;
    scrollbar-width: none;
}

.orders-panel::-webkit-scrollbar {
    display: none;
}

.orders-container {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.order-card {
    background: white;
    border-radius: 20px;
    padding: 24px;
    border-left: 6px solid #ff701c;
    box-shadow: 0 7px 22px rgba(97, 49, 18, 0.07);
}

.order-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 20px;
}

.order-title {
    color: #e9571b;
    font-size: 20px;
    font-weight: bold;
}

.status-badge {
    background: #fff0e2;
    color: #e96516;
    border: 1px solid #ffc79e;
    padding: 8px 15px;
    border-radius: 30px;
    font-size: 12px;
    font-weight: bold;
}

.order-details {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 13px;
    background: #fffaf7;
    padding: 18px;
    border-radius: 15px;
}

.detail-item {
    font-size: 14px;
    line-height: 1.6;
    overflow-wrap: anywhere;
}

.detail-item strong {
    color: #e96624;
}

.items-section {
    background: #fff7f0;
    padding: 18px;
    border-radius: 15px;
    margin-top: 18px;
}

.items-section h4 {
    color: #df531b;
    margin-bottom: 12px;
}

.item-row {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    padding: 10px 0;
    border-bottom: 1px solid #f3ded0;
    font-size: 14px;
}

.item-row strong {
    color: #e96624;
}

.total-amount {
    text-align: right;
    color: #e65316;
    font-size: 21px;
    font-weight: bold;
    margin: 20px 0;
}

.action-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 9px;
}

.action-buttons button {
    border: none;
    padding: 11px 14px;
    border-radius: 10px;
    color: white;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
}

.pending-btn {
    background: #ff9800;
}

.preparing-btn {
    background: #ed7217;
}

.delivery-btn {
    background: #d95b0b;
}

.delivered-btn {
    background: #388e3c;
}

.reject-btn {
    background: #c62828;
}

.delete-btn {
    background: #4b403b;
}

.empty-message {
    background: white;
    text-align: center;
    padding: 45px 20px;
    border-radius: 18px;
    color: #92776a;
}

.empty-message h3 {
    color: #e9571b;
    margin-bottom: 10px;
}

footer {
    margin-top: 40px;
    padding: 28px;
    text-align: center;
    background: #241712;
    color: #d9b9a7;
    font-size: 13px;
}

@media (max-width: 950px) {
    .summary-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 600px) {
    .main-container {
        width: 94%;
    }

    .summary-grid {
        gap: 12px;
    }

    .summary-card {
        padding: 17px;
    }

    .summary-card h2 {
        font-size: 25px;
    }

    .order-details {
        grid-template-columns: 1fr;
    }

    .action-buttons button {
        flex: 1 1 45%;
    }
}
</style>
</head>

<body>

<nav class="navbar">
    <div class="logo">🍴 <span>Foodie</span> Admin</div>
    <div class="admin-badge">● Administrator Panel</div>
</nav>

<main class="main-container">

    <section class="welcome">
        <div>
            <h1>Good Day, Admin 👋</h1>
            <p>Track orders and manage customer messages.</p>
        </div>

        <div class="welcome-icon">🍔</div>
    </section>

    <!-- SUMMARY -->

    <section class="summary-grid">

        <div class="summary-card">
            <div class="card-icon">📦</div>
            <h3>TOTAL ORDERS</h3>
            <h2 id="totalOrders">0</h2>
        </div>

        <div class="summary-card">
            <div class="card-icon">⏳</div>
            <h3>PENDING ORDERS</h3>
            <h2 id="pendingOrders">0</h2>
        </div>

        <div class="summary-card">
            <div class="card-icon">👨‍🍳</div>
            <h3>PREPARING ORDERS</h3>
            <h2 id="preparingOrders">0</h2>
        </div>

        <div class="summary-card">
            <div class="card-icon">✅</div>
            <h3>DELIVERED ORDERS</h3>
            <h2 id="deliveredOrders">0</h2>
        </div>

    </section>

    <!-- ORDERS -->

    <section>

        <div class="section-header">
            <h2>📋 <span>Customer</span> Orders</h2>

            <select id="statusFilter"
                    class="filter-box"
                    onchange="filterOrders()">

                <option value="All">All Orders</option>
                <option value="Pending">Pending</option>
                <option value="Preparing">Preparing</option>
                <option value="Out for Delivery">Out for Delivery</option>
                <option value="Delivered">Delivered</option>
                <option value="Rejected">Rejected</option>

            </select>
        </div>

        <div class="orders-panel">
            <div id="ordersContainer" class="orders-container"></div>
        </div>

    </section>

    <!-- CONTACT MESSAGES -->

    <section>

        <div class="section-header">
            <h2>📩 <span>Contact</span> Messages</h2>
        </div>

        <div class="orders-panel">
            <div id="contactContainer" class="orders-container"></div>
        </div>

    </section>

</main>

<footer>
    © 2026 Foodie | Smart Food Delivery Management
</footer>

<script>

const ORDER_API = "http://localhost:5000/api/orders";
const CONTACT_API = "http://localhost:5000/api/contact";

let allOrders = [];

/* LOAD ORDERS */

async function loadOrders() {

    const container = document.getElementById("ordersContainer");

    container.innerHTML = `
        <div class="empty-message">
            <h3>Loading Orders...</h3>
            <p>Please wait a moment.</p>
        </div>
    `;

    try {

        const response = await fetch(ORDER_API);

        if (!response.ok) {
            throw new Error("Unable to fetch orders");
        }

        allOrders = await response.json();

        updateSummary();
        filterOrders();

    } catch (error) {

        console.error(error);

        container.innerHTML = `
            <div class="empty-message">
                <h3>Unable to Load Orders</h3>
                <p>Check whether the backend server is running.</p>
            </div>
        `;

    }

}

/* SUMMARY */

function updateSummary() {

    document.getElementById("totalOrders").textContent =
        allOrders.length;

    document.getElementById("pendingOrders").textContent =
        allOrders.filter(order =>
            (order.status || "Pending") === "Pending"
        ).length;

    document.getElementById("preparingOrders").textContent =
        allOrders.filter(order =>
            order.status === "Preparing"
        ).length;

    document.getElementById("deliveredOrders").textContent =
        allOrders.filter(order =>
            order.status === "Delivered"
        ).length;

}

/* FILTER */

function filterOrders() {

    const selectedStatus =
        document.getElementById("statusFilter").value;

    let filteredOrders = allOrders;

    if (selectedStatus !== "All") {

        filteredOrders = allOrders.filter(order =>
            (order.status || "Pending") === selectedStatus
        );

    }

    displayOrders(filteredOrders);

}

/* DISPLAY ORDERS */

function displayOrders(orders) {

    const container =
        document.getElementById("ordersContainer");

    if (orders.length === 0) {

        container.innerHTML = `
            <div class="empty-message">
                <h3>No Orders Found</h3>
                <p>There are no orders in this category.</p>
            </div>
        `;

        return;

    }

    container.innerHTML = orders.map((order, index) => {

        const orderId = order._id;
        const status = order.status || "Pending";

        const items = Array.isArray(order.items)
            ? order.items
            : [];

        const itemsHTML = items.length > 0

            ? items.map(item => `

                <div class="item-row">

                    <span>
                        ${item.name || "Food Item"}
                        × ${item.quantity || 1}
                    </span>

                    <strong>
                        ₹${Number(item.price || 0) *
                           Number(item.quantity || 1)}
                    </strong>

                </div>

            `).join("")

            : `<p>No item details available</p>`;

        const orderDate = order.createdAt
            ? new Date(order.createdAt).toLocaleString()
            : "Not available";

        return `

            <div class="order-card">

                <div class="order-top">

                    <div class="order-title">
                        🧾 Order ${index + 1}
                    </div>

                    <div class="status-badge">
                        ${status}
                    </div>

                </div>

                <div class="order-details">

                    <div class="detail-item">
                        <strong>Order ID:</strong><br>
                        ${orderId || "Not available"}
                    </div>

                    <div class="detail-item">
                        <strong>Customer Name:</strong><br>
                        ${order.customerName || "Not available"}
                    </div>

                    <div class="detail-item">
                        <strong>Email:</strong><br>
                        ${order.email || "Not available"}
                    </div>

                    <div class="detail-item">
                        <strong>Phone:</strong><br>
                        ${order.phone || "Not available"}
                    </div>

                    <div class="detail-item">
                        <strong>Address:</strong><br>
                        ${order.address || "Not available"}
                    </div>

                    <div class="detail-item">
                        <strong>Order Date:</strong><br>
                        ${orderDate}
                    </div>

                </div>

                <div class="items-section">

                    <h4>🍔 Ordered Items</h4>

                    ${itemsHTML}

                </div>

                <div class="total-amount">
                    Total: ₹${Number(order.totalAmount || 0)}
                </div>

                <div class="action-buttons">

                    <button class="pending-btn"
                        onclick="updateStatus('${orderId}', 'Pending')">
                        Pending
                    </button>

                    <button class="preparing-btn"
                        onclick="updateStatus('${orderId}', 'Preparing')">
                        Preparing
                    </button>

                    <button class="delivery-btn"
                        onclick="updateStatus('${orderId}', 'Out for Delivery')">
                        Out for Delivery
                    </button>

                    <button class="delivered-btn"
                        onclick="updateStatus('${orderId}', 'Delivered')">
                        Delivered
                    </button>

                    <button class="reject-btn"
                        onclick="updateStatus('${orderId}', 'Rejected')">
                        Reject
                    </button>

                    <button class="delete-btn"
                        onclick="deleteOrder('${orderId}')">
                        Delete
                    </button>

                </div>

            </div>

        `;

    }).join("");

}

/* UPDATE STATUS */

async function updateStatus(orderId, newStatus) {

    try {

        const response = await fetch(
            ORDER_API + "/" + orderId,
            {
                method: "PUT",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    status: newStatus
                })
            }
        );

        const result = await response.json();

        if (!response.ok) {
            throw new Error(result.message || "Status update failed");
        }

        alert("Order status updated successfully!");

        await loadOrders();

    } catch (error) {

        console.error(error);

        alert("Status update failed: " + error.message);

    }

}

/* DELETE ORDER */

async function deleteOrder(orderId) {

    const confirmDelete = confirm(
        "Are you sure you want to delete this order?"
    );

    if (!confirmDelete) {
        return;
    }

    try {

        const response = await fetch(
            ORDER_API + "/" + orderId,
            {
                method: "DELETE"
            }
        );

        const result = await response.json();

        if (!response.ok) {
            throw new Error(result.message || "Delete failed");
        }

        alert("Order deleted successfully!");

        await loadOrders();

    } catch (error) {

        console.error(error);

        alert("Delete failed: " + error.message);

    }

}

/* LOAD CONTACT MESSAGES */

async function loadContactMessages() {

    const container =
        document.getElementById("contactContainer");

    container.innerHTML = `
        <div class="empty-message">
            <h3>Loading Messages...</h3>
            <p>Please wait a moment.</p>
        </div>
    `;

    try {

        const response = await fetch(CONTACT_API);

        if (!response.ok) {
            throw new Error("Unable to fetch messages");
        }

        const messages = await response.json();

        if (messages.length === 0) {

            container.innerHTML = `
                <div class="empty-message">
                    <h3>No Contact Messages</h3>
                    <p>No messages received yet.</p>
                </div>
            `;

            return;

        }

        container.innerHTML = messages.map(message => `

            <div class="order-card">

                <div class="order-top">

                    <div class="order-title">
                        📩 ${message.subject || "No Subject"}
                    </div>

                    <div class="status-badge">
                        New Message
                    </div>

                </div>

                <div class="order-details">

                    <div class="detail-item">
                        <strong>Name:</strong><br>
                        ${message.name || "Not available"}
                    </div>

                    <div class="detail-item">
                        <strong>Email:</strong><br>
                        ${message.email || "Not available"}
                    </div>

                    <div class="detail-item">
                        <strong>Date:</strong><br>
                        ${
                            message.createdAt
                            ? new Date(message.createdAt).toLocaleString()
                            : "Not available"
                        }
                    </div>

                </div>

                <div class="items-section">

                    <h4>💬 Customer Message</h4>

                    <p>${message.message || "No message available"}</p>

                </div>

            </div>

        `).join("");

    } catch (error) {

        console.error(error);

        container.innerHTML = `
            <div class="empty-message">
                <h3>Unable to Load Messages</h3>
                <p>Check whether the backend server is running.</p>
            </div>
        `;

    }

}

/* START */

loadOrders();
loadContactMessages();

</script>

</body>
</html>
